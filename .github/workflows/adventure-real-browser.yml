name: Adventure real-browser quality gate
on:
  push:
    branches: [fix/adventure-real-screen-verification-20261008, junja-adventure-preview, railway-recovery]
  pull_request:
    branches: [junja-adventure-preview]
permissions:
  contents: read
jobs:
  browser-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix adventure-online/server/online --omit=dev
      - run: node --check adventure-online/image-prototype/app.js && node --check adventure-online/image-prototype/movement-feel.js && node --check adventure-online/image-prototype/monster-art.js && node --check adventure-online/server/online/server.mjs
      - run: node --test adventure-online/image-prototype/tests/movement-feel.test.mjs adventure-online/image-prototype/tests/mobile-performance.test.mjs adventure-online/image-prototype/tests/ui-clarity.test.mjs adventure-online/image-prototype/tests/ios-viewport-lock.test.mjs adventure-online/server/online/tests/forage-balance.test.mjs
      - run: node --test adventure-online/image-prototype/tests/rendered-screen.test.mjs adventure-online/image-prototype/tests/quality2.test.mjs adventure-online/image-prototype/tests/auto-skills.test.mjs adventure-online/image-prototype/tests/polish.test.mjs adventure-online/server/online/tests/operator-auto.test.mjs adventure-online/server/online/tests/assets.test.mjs adventure-online/server/online/tests/combo.test.mjs adventure-online/server/online/tests/action-ack.test.mjs adventure-online/server/online/tests/map-travel.test.mjs adventure-online/server/online/tests/party-dungeon.test.mjs
      - run: node --test adventure-online/server/online/tests/ascension.test.mjs adventure-online/server/online/tests/creator-balance.test.mjs
      - run: node --test adventure-online/server/online/tests/primordial.test.mjs adventure-online/server/online/tests/creation-primordial.test.mjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node adventure-online/browser-e2e.mjs
      - name: Real mobile movement + server reconciliation E2E
        run: node adventure-online/movement-e2e.mjs
      - name: Verify compact kill notifications and reduced mobile rendering overhead
        run: node adventure-online/mobile-performance-e2e.mjs
      - name: Verify smaller avatars, more gathering sites and name-matched new monsters
        run: node adventure-online/ui-monsters-e2e.mjs
      - name: iPhone fixed viewport and pinch protection E2E
        run: node adventure-online/viewport-lock-e2e.mjs
      - name: Save real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adventure-actual-browser-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore
