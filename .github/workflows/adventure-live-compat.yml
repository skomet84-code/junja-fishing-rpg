name: Adventure live compatibility regression
on:
  push:
    branches: [fix/adventure-live-combo-assets-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix adventure-online/server/online --omit=dev
      - run: node --check adventure-online/image-prototype/app.js && node --check adventure-online/server/online/engine.mjs && node --check adventure-online/server/online/server.mjs
      - run: node --test adventure-online/image-prototype/tests/combat-queue.test.mjs adventure-online/server/online/tests/combo.test.mjs adventure-online/server/online/tests/assets.test.mjs
