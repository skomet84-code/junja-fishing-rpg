name: Adventure quality phase 2
on:
  push:
    branches: [fix/adventure-quality-phase2-20261008]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix adventure-online/server/online --omit=dev
      - run: node --check adventure-online/image-prototype/app.js && node --check adventure-online/server/online/server.mjs && node --check adventure-online/server/online/engine.mjs
      - run: node --test adventure-online/image-prototype/tests/quality2.test.mjs adventure-online/image-prototype/tests/auto-skills.test.mjs adventure-online/image-prototype/tests/polish.test.mjs adventure-online/image-prototype/tests/combat-queue.test.mjs adventure-online/server/online/tests/operator-auto.test.mjs adventure-online/server/online/tests/action-ack.test.mjs adventure-online/server/online/tests/combo.test.mjs adventure-online/server/online/tests/assets.test.mjs
