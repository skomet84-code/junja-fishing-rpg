name: Adventure warrior graphics and combat quality
on:
  push:
    branches: [fix/adventure-warrior-feel-20261008]
permissions:
  contents: read
jobs:
  regression-and-rendered-game:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix adventure-online/server/online --omit=dev
      - run: node --check adventure-online/image-prototype/app.js && node --check adventure-online/server/online/server.mjs
      - run: node --test adventure-online/image-prototype/tests/warrior-feel.test.mjs adventure-online/image-prototype/tests/rendered-screen.test.mjs adventure-online/image-prototype/tests/quality2.test.mjs adventure-online/image-prototype/tests/auto-skills.test.mjs adventure-online/image-prototype/tests/polish.test.mjs adventure-online/server/online/tests/operator-auto.test.mjs adventure-online/server/online/tests/assets.test.mjs adventure-online/server/online/tests/combo.test.mjs adventure-online/server/online/tests/action-ack.test.mjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node adventure-online/browser-e2e.mjs
      - name: Record mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warrior-real-browser-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore
