name: Adventure operator combat diagnostics
on:
  push:
    branches: [fix/adventure-admin-autoskill-20261008]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix adventure-online/server/online --omit=dev
      - run: node --test adventure-online/server/online/tests/operator-auto.test.mjs
