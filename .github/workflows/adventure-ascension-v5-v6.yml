name: Adventure ascension 5-6 regression
on:
  push:
    branches: [feature/ascension-v5-v6-20261009]
  pull_request:
    branches: [junja-adventure-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix adventure-online/server/online --omit=dev
      - name: Syntax validation
        run: |
          node --check adventure-online/image-prototype/mmo-data.js
          node --check adventure-online/image-prototype/catalog.js
          node --check adventure-online/image-prototype/app.js
          node --check adventure-online/server/online/engine.mjs
          node --check adventure-online/server/online/systems.mjs
          node --check adventure-preview/app.js
          node --check adventure-preview/mmo-data.js
      - name: Story progression and existing regression
        run: node --test adventure-online/server/online/tests/*.test.mjs adventure-online/image-prototype/tests/*.test.mjs
