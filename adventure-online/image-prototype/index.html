<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18362c"><title>준자 어드벤처 · 온라인</title><link rel="stylesheet" href="./style.css?v=20261009-primordial-motion1"><style>
.promotion-aura{display:none;position:absolute;left:50%;top:68%;width:76%;height:36%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:-2}
.entity.hero[data-rank='1']>.promotion-aura{display:block;border:2px solid #e8cb75;box-shadow:0 0 13px #e8cb75;animation:pa 2.2s ease-in-out infinite alternate}
.entity.hero[data-rank='2']>.promotion-aura{display:block;border:3px solid #79adff;box-shadow:0 0 19px #618cff;animation:pa 1.8s ease-in-out infinite alternate}
.entity.hero[data-rank='3']>.promotion-aura{display:block;border:3px solid #ce66ff;box-shadow:0 0 25px #a63cff;animation:pa 1.35s ease-in-out infinite alternate}
.entity.hero[data-rank='4']>.promotion-aura{display:block;width:94%;height:46%;border:4px solid #fff0a4;background:radial-gradient(ellipse,#fff3 0 20%,transparent 70%);box-shadow:0 0 24px #fff0a4,0 0 44px #a556ff;animation:pa .8s ease-in-out infinite alternate}
.entity.hero[data-job='warrior'][data-rank='4']>.promotion-aura{border-color:#ffd45d;box-shadow:0 0 24px #ffbd4a,0 0 46px #ff6c39}
.entity.hero[data-job='rogue'][data-rank='4']>.promotion-aura{border-color:#f36cff;box-shadow:0 0 25px #dc51ff,0 0 48px #5425bb}
.entity.hero[data-job='mage'][data-rank='4']>.promotion-aura{border-color:#83d4ff;box-shadow:0 0 25px #7acfff,0 0 48px #696cff}
.entity.hero[data-job='healer'][data-rank='4']>.promotion-aura{border-color:#bfff91;box-shadow:0 0 25px #b4ff80,0 0 48px #fff0a0}
.entity.hero[data-rank='1']>.sprite,.entity.hero[data-rank='1']>.production-sprite{filter:drop-shadow(0 0 5px #e8cb75) saturate(1.04)}
.entity.hero[data-rank='2']>.sprite,.entity.hero[data-rank='2']>.production-sprite{filter:drop-shadow(0 0 8px #79adff) saturate(1.10) contrast(1.03)}
.entity.hero[data-rank='3']>.sprite,.entity.hero[data-rank='3']>.production-sprite{filter:drop-shadow(0 0 11px #ce66ff) saturate(1.18) contrast(1.05)}
.entity.hero[data-rank='4']>.sprite,.entity.hero[data-rank='4']>.production-sprite{filter:drop-shadow(0 0 12px #fff0a4) drop-shadow(0 0 19px #a65cff) saturate(1.28) contrast(1.08)}
.character-preview.rank-4{border-radius:12px;box-shadow:inset 0 0 14px #fff0a455,0 0 12px #a559ff88}.character-preview.rank-4 img{filter:drop-shadow(0 0 8px #fff0a0) drop-shadow(0 0 12px #a55dff)}
.promotion-trials{display:grid;grid-template-columns:1fr 1fr;gap:7px}.promotion-trial{padding:8px;border:1px solid #ffffff22;border-radius:9px;background:#12251c}.promotion-trial b,.promotion-trial span{display:block}.promotion-trial span{font-size:10px;color:#bdc7b6}.promotion-trial.done{border-color:#75c67b}.promotion-trial.current{border-color:#e6c66a;background:#3a311b}
.promotion-flash{position:absolute;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;background:radial-gradient(circle,#ffe88b66,#7b3eaa44 30%,#000d 75%);animation:pf 2.6s ease-out forwards}.promotion-flash b{font-size:34px;color:#fff0a4}.promotion-flash strong{font-size:25px;color:#fff}.promotion-flash.rank-4 strong{color:#fff0a4;text-shadow:0 0 18px #b659ff}
.skillfx.ascension{width:300px;height:300px;border-radius:50%;border:5px solid #fff0a4;background:radial-gradient(circle,#fff5,#a65bff33 28%,transparent 70%);box-shadow:0 0 30px #fff0a4,0 0 55px #9c5cff;animation:ab 1.5s ease-out forwards}.skillfx.ascension i{left:50%;top:50%;width:8px;height:125px;transform-origin:50% 100%;background:linear-gradient(transparent,#fff7c7,#a67cff)}.skillfx.ascension i:nth-child(2){rotate:72deg}.skillfx.ascension i:nth-child(3){rotate:144deg}.skillfx.ascension i:nth-child(4){rotate:216deg}.skillfx.ascension i:nth-child(5){rotate:288deg}
@keyframes pa{from{opacity:.55;scale:.93}to{opacity:1;scale:1.08}}@keyframes pf{0%{opacity:0}12%,72%{opacity:1}100%{opacity:0}}@keyframes ab{0%{opacity:0;scale:.25}25%{opacity:1;scale:1}100%{opacity:0;scale:1.55}}
@media(max-width:600px){.skillbar{right:6px;gap:3px}.skillbar button{width:54px;min-height:49px;padding:4px;font-size:9px}.promotion-trials{grid-template-columns:1fr}}
</style></head><body>
<main id="game"><div id="viewport" tabindex="0" aria-label="게임 월드"><div id="world"><div id="zoneDecor"></div><div id="portal" class="portal">다람쥐 숲 ↓</div><button id="elder" class="npc" aria-label="촌장과 대화"><span class="npc-art"></span><b>촌장 · 퀘스트</b></button><button id="merchant" class="npc" aria-label="상인과 대화"><span class="npc-art"></span><b>약초 · 장비 상인</b></button><div id="resourceLayer"></div><div id="enemyLayer"></div><div id="hero" class="entity hero"><div class="shadow"></div><div id="heroArt" class="sprite"></div><b class="entity-name">준자</b><div id="swing"></div></div><div id="marker"></div><div id="effects"></div></div></div>
<header><div class="profile"><div class="portrait"></div><div class="stats"><div><b id="playerName">준자</b><strong id="level"></strong></div><div class="bar hp"><i id="hpBar"></i><span id="hpText"></span></div><div class="bar mp"><i id="mpBar"></i><span id="mpText"></span></div><div class="bar exp"><i id="expBar"></i></div><small id="expText"></small></div></div><div class="zone"><b id="zone"></b><span id="gold"></span><small id="activeBoosts" style="display:block;color:#ffe09c;max-width:190px;font-size:10px" aria-live="off"></small><small id="saveStatus"></small></div></header>
<button id="onlineBtn" class="online-badge">● 온라인 <span id="onlineCount">0명</span></button><section id="minimapWrap"><button id="minimapToggle" type="button" aria-controls="minimap" aria-expanded="false" aria-label="필드 미니맵 펼치기">지도 +</button><b>FIELD MAP</b><canvas id="minimap" width="180" height="120"></canvas><small id="minimapLabel"></small></section><section id="quest"><button id="questToggle" aria-label="퀘스트 접기">−</button><b id="questTitle"></b><p id="questText"></p><button id="questAction"></button></section>
<section id="targetPanel" hidden><b id="targetName"></b><span id="targetRange"></span><div class="bar enemyhp"><i id="targetHp"></i></div></section><button id="socialAlert" hidden></button><div id="duelHud" hidden></div><div id="hint">몬스터 터치 = 타겟 고정·자동 추적/공격 · 지도·이동 = 즉시 순간이동</div><div id="toast" role="status" aria-live="polite"></div><div id="combatReadout" hidden aria-live="off"></div><div id="damageFlash" aria-hidden="true"></div><div id="bossWarning" hidden></div><div id="warpFx" hidden><i></i><b></b></div><div id="joystick" hidden><i></i></div>
<nav class="utility" id="utilityNav"><button id="utilityToggle" aria-expanded="false" aria-label="기타 메뉴 열기">메뉴 +</button><button id="bagBtn">장비·가방</button><button id="boostBtn">✨ 경험치 +20%</button><button id="homeBtn">귀환</button><button id="jobBtn">직업</button><button id="ascensionBtn">5·6차 시련</button><button id="chatBtn">채팅</button><button id="adventureBtn">지도·이동</button><button id="rankingBtn">🏆 랭킹</button><button id="socialBtn">PVP·거래</button><button id="soundBtn" aria-pressed="false">사운드 <small>OFF</small></button><button id="helpBtn">?</button></nav><div id="chatLog" aria-live="polite"></div><div class="skillbar" id="skillbar"></div>
<nav class="actions"><button id="contextBtn" hidden>대화</button><button id="potionBtn">HP 물약 <small id="potionLabel"></small></button><button id="autoBtn" aria-pressed="false">자동 <small>OFF</small></button><button id="attackBtn">공격 <small id="attackLabel">대상 선택</small></button></nav>
<div id="modal" class="overlay" hidden><section class="modal"><button id="modalClose" aria-label="창 닫기">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalActions"></div></section></div>
<div id="loading" class="overlay"><section class="load-card"><h1>JUNJA<br>ADVENTURE</h1><p id="loadMessage">친구들과 함께하는 준자마을</p><div id="authPanel"><form id="authForm"><label>아이디<input id="username" autocomplete="username" minlength="2" maxlength="20" required placeholder="게임에서 사용할 이름"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" minlength="6" maxlength="72" required placeholder="6자 이상"></label><label id="legacyRow" class="check" hidden><input id="legacyCheck" type="checkbox" checked>이 기기의 이전 기록을 전사로 가져오기</label><div class="auth-actions"><button type="submit" id="loginBtn">로그인</button><button type="button" id="registerBtn">새 계정 만들기</button></div></form><p id="authMessage" role="status"></p></div><div id="selectPanel" hidden><p id="welcome"></p><div id="characterCards"></div><label>채널 이름<input id="channelInput" value="준자마을" maxlength="16" placeholder="친구와 같은 이름을 입력"></label><small>같은 채널에서 만나 함께 사냥해요 · 최대 48명</small><button id="joinBtn">모험 시작</button><button id="switchAccount">다른 계정</button></div><button id="retryBtn" hidden>다시 연결</button></section></div>
</main><script type="module" src="./app.js?v=20261009-live-jobboost2"></script></body></html>
