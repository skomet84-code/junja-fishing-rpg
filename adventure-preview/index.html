<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18362c"><title>준자 어드벤처 · 온라인</title><link rel="stylesheet" href="./style.css?v=20261007-shadow2"></head><body>
<main id="game"><div id="viewport" tabindex="0" aria-label="게임 월드"><div id="world"><div id="zoneDecor"></div><div id="portal" class="portal">다람쥐 숲 ↓</div><button id="elder" class="npc" aria-label="촌장과 대화"><span class="npc-art"></span><b>촌장 · 퀘스트</b></button><button id="merchant" class="npc" aria-label="상인과 대화"><span class="npc-art"></span><b>약초 · 장비 상인</b></button><div id="resourceLayer"></div><div id="enemyLayer"></div><div id="hero" class="entity hero"><div class="shadow"></div><div id="heroArt" class="sprite"></div><b class="entity-name">준자</b><div id="swing"></div></div><div id="marker"></div><div id="effects"></div></div></div>
<header><div class="profile"><div class="portrait"></div><div class="stats"><div><b id="playerName">준자</b><strong id="level"></strong></div><div class="bar hp"><i id="hpBar"></i><span id="hpText"></span></div><div class="bar mp"><i id="mpBar"></i><span id="mpText"></span></div><div class="bar exp"><i id="expBar"></i></div><small id="expText"></small></div></div><div class="zone"><b id="zone"></b><span id="gold"></span><small id="saveStatus"></small></div></header>
<button id="onlineBtn" class="online-badge">● 온라인 <span id="onlineCount">0명</span></button><section id="minimapWrap"><b>FIELD MAP</b><canvas id="minimap" width="180" height="120"></canvas><small id="minimapLabel"></small></section><section id="quest"><button id="questToggle" aria-label="퀘스트 접기">−</button><b id="questTitle"></b><p id="questText"></p><button id="questAction"></button></section>
<section id="targetPanel" hidden><b id="targetName"></b><span id="targetRange"></span><div class="bar enemyhp"><i id="targetHp"></i></div></section><button id="socialAlert" hidden></button><div id="duelHud" hidden></div><div id="hint">몬스터 터치 = 타겟 고정·자동 추적/공격 · 지도·이동 = 즉시 순간이동</div><div id="toast" role="status" aria-live="polite"></div><div id="bossWarning" hidden></div><div id="warpFx" hidden><i></i><b></b></div><div id="joystick" hidden><i></i></div>
<nav class="utility"><button id="bagBtn">장비·가방</button><button id="homeBtn">귀환</button><button id="jobBtn">직업</button><button id="chatBtn">채팅</button><button id="adventureBtn">지도·이동</button><button id="socialBtn">PVP·거래</button><button id="soundBtn" aria-pressed="false">사운드 <small>OFF</small></button><button id="helpBtn">?</button></nav><div id="chatLog" aria-live="polite"></div><div class="skillbar" id="skillbar"></div>
<nav class="actions"><button id="contextBtn" hidden>대화</button><button id="potionBtn">HP 물약 <small id="potionLabel"></small></button><button id="autoBtn" aria-pressed="false">자동 <small>OFF</small></button><button id="attackBtn">공격 <small id="attackLabel">대상 선택</small></button></nav>
<div id="modal" class="overlay" hidden><section class="modal"><button id="modalClose" aria-label="창 닫기">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalActions"></div></section></div>
<div id="loading" class="overlay"><section class="load-card"><h1>JUNJA<br>ADVENTURE</h1><p id="loadMessage">친구들과 함께하는 준자마을</p><div id="authPanel"><form id="authForm"><label>아이디<input id="username" autocomplete="username" minlength="2" maxlength="20" required placeholder="게임에서 사용할 이름"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" minlength="6" maxlength="72" required placeholder="6자 이상"></label><label id="legacyRow" class="check" hidden><input id="legacyCheck" type="checkbox" checked>이 기기의 이전 기록을 전사로 가져오기</label><div class="auth-actions"><button type="submit" id="loginBtn">로그인</button><button type="button" id="registerBtn">새 계정 만들기</button></div></form><p id="authMessage" role="status"></p></div><div id="selectPanel" hidden><p id="welcome"></p><div id="characterCards"></div><label>채널 이름<input id="channelInput" value="준자마을" maxlength="16" placeholder="친구와 같은 이름을 입력"></label><small>같은 채널에서 만나 함께 사냥해요 · 최대 48명</small><button id="joinBtn">모험 시작</button><button id="switchAccount">다른 계정</button></div><button id="retryBtn" hidden>다시 연결</button></section></div>
</main><script type="module" src="./app.js?v=20261007-shadow2"></script></body></html>
