<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18362c"><title>준자 어드벤처</title><link rel="stylesheet" href="./style.css?v=20261006-2"></head><body>
<main id="game"><div id="viewport" tabindex="0" aria-label="게임 월드. 화면 터치 또는 방향키로 이동"><div id="world"><div id="portal" class="portal">다람쥐 숲 ↓</div><button id="elder" class="npc" aria-label="촌장과 대화"><span class="npc-art"></span><b>촌장 · 퀘스트</b></button><button id="merchant" class="npc" aria-label="상인과 대화"><span class="npc-art"></span><b>약초 상인</b></button><div id="enemyLayer"></div><div id="hero" class="entity hero"><div class="shadow"></div><div id="heroArt" class="sprite"></div><b class="entity-name">준자</b><div id="swing"></div></div><div id="marker"></div><div id="effects"></div></div></div>
<header><div class="profile"><div class="portrait"></div><div class="stats"><div><b>준자</b><strong id="level"></strong></div><div class="bar hp"><i id="hpBar"></i><span id="hpText"></span></div><div class="bar exp"><i id="expBar"></i></div><small id="expText"></small></div></div><div class="zone"><b id="zone"></b><span id="gold"></span><small id="saveStatus"></small></div></header>
<section id="quest"><button id="questToggle" aria-label="퀘스트 접기">−</button><b id="questTitle"></b><p id="questText"></p><button id="questAction"></button></section>
<section id="targetPanel" hidden><b id="targetName"></b><span id="targetRange"></span><div class="bar enemyhp"><i id="targetHp"></i></div></section>
<div id="hint">빈 곳 터치로 이동 · 다람쥐 터치로 대상 선택</div><div id="toast" role="status" aria-live="polite"></div><div id="joystick" hidden><i></i></div>
<nav class="utility"><button id="bagBtn">가방</button><button id="homeBtn">귀환</button><button id="helpBtn">조작법</button></nav>
<nav class="actions"><button id="contextBtn" hidden>대화</button><button id="potionBtn">물약 <small id="potionLabel"></small></button><button id="autoBtn" aria-pressed="false">자동 <small>OFF</small></button><button id="skillBtn">회전베기 <small id="skillLabel">Lv.2</small></button><button id="attackBtn">공격 <small id="attackLabel">대상 선택</small></button></nav>
<div id="modal" class="overlay" hidden><section class="modal"><button id="modalClose" aria-label="창 닫기">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalActions"></div></section></div>
<div id="loading" class="overlay"><section class="load-card"><h1>JUNJA<br>ADVENTURE</h1><p id="loadMessage">준자마을을 준비하고 있어요…</p><button id="retryBtn" hidden>다시 불러오기</button></section></div>
</main><script type="module" src="./app.js?v=20261006-2"></script></body></html>
