<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b120d" />
  <title>준자 어드벤처 — 이동 플레이 프로토타입</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<main id="game" class="game loading">
  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <div id="forestMark" class="forest-mark">↓ 다람쥐 숲</div>
      <div id="targetMarker" class="target-marker"></div>
      <div id="enemies" class="enemies"></div>
      <div id="hero" class="hero">
        <div class="hero-name">준자</div>
        <img id="heroImg" alt="준자" draggable="false" />
        <div class="hero-shadow"></div>
      </div>
    </div>
  </div>

  <header class="hud">
    <div class="profile">
      <div id="avatar" class="avatar"></div>
      <div class="profile-copy">
        <div class="name-row"><strong>준자</strong><span id="levelText">Lv.1</span></div>
        <div class="bar hp"><i></i></div>
        <div class="bar exp"><i id="expBar"></i></div>
        <small id="expText">EXP 0 / 60</small>
      </div>
    </div>
    <div class="hud-right">
      <div id="killText" class="kill-chip">다람쥐 0</div>
      <button id="resetBtn" class="mini">초기화</button>
    </div>
  </header>

  <div id="mission" class="mission">
    <b>화면을 터치해서 이동</b>
    <span>아래쪽 다람쥐 숲으로 직접 걸어가 보세요.</span>
  </div>

  <div id="enemyInfo" class="enemy-info hidden">
    <div><b id="enemyName">다람쥐 Lv.1</b><span id="enemyDistance"></span></div>
    <div class="enemy-big-hp"><i id="enemyHpBar"></i></div>
  </div>

  <div id="toast" class="toast"></div>

  <button id="attackBtn" class="attack" disabled>
    <span class="sword">⚔</span><strong>공격</strong><small id="attackHint">가까이 이동</small>
  </button>

  <div id="loading" class="loading-card">
    <b>JUNJA ADVENTURE</b>
    <span>실제 이동 월드를 준비하는 중…</span>
  </div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
